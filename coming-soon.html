<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WeDent - Coming Soon. Something amazing is on the way!">
    <title>Coming Soon | WeDent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="preloader">
        <div class="preloader-spinner"></div>
    </div>

    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <main class="coming-soon">
        <div class="coming-soon-content">
            <div class="brand-logo">
                <i class="fas fa-tooth"></i>
                <span>WeDent</span>
            </div>

            <h1>Coming Soon</h1>
            <p>We're working hard to bring you something amazing. Stay tuned!</p>

            <div class="countdown-timer">
                <div class="countdown-item glass">
                    <span class="count-number" id="days">00</span>
                    <span class="count-label">Days</span>
                </div>
                <div class="countdown-item glass">
                    <span class="count-number" id="hours">00</span>
                    <span class="count-label">Hours</span>
                </div>
                <div class="countdown-item glass">
                    <span class="count-number" id="minutes">00</span>
                    <span class="count-label">Minutes</span>
                </div>
                <div class="countdown-item glass">
                    <span class="count-number" id="seconds">00</span>
                    <span class="count-label">Seconds</span>
                </div>
            </div>

            <form class="subscribe-form" id="subscribeForm">
                <div class="form-group">
                    <input type="email" placeholder="Enter your email address" required>
                    <button type="submit" class="btn btn-primary">Subscribe</button>
                </div>
            </form>

            <div class="footer-socials">
                <a href="https://facebook.com/wedent" target="_blank" rel="noopener" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="https://instagram.com/wedent" target="_blank" rel="noopener" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="https://twitter.com/wedent" target="_blank" rel="noopener" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                <a href="https://linkedin.com/company/wedent" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="copyright-bar">
                <p>&copy; 2026 WeDent. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
</body>
</html>
